<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6F0F8">
<title>Road to Middle School · 중학교 대비 영문법</title>
<style>
:root{
  --bg:#FAF7F2; --card:#FFFFFF; --ink:#1F2430; --sub:#6B7280; --line:#E9E3D8;
  --p1:#1F9D6B; --p2:#2F6FDE; --p3:#EE8A1E; --p4:#8B5CF6; --p5:#E5484D; --p6:#334155;
  --ok:#15803D; --okbg:#E7F6EC; --no:#C62828; --nobg:#FDECEC; --hint:#FFF6DB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:17px;line-height:1.55;word-break:keep-all}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:none;background:none}
button:disabled{cursor:default}
.en{font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:.1px}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(28px + env(safe-area-inset-bottom))}

/* ---------- 홈: Road to Middle School ---------- */
.hero{position:relative;margin:0 -16px;height:350px;overflow:hidden}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-text{position:absolute;top:24px;left:22px;right:22px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#4F6B86}
.hero h1{font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:36px;font-weight:800;line-height:1.05;margin:6px 0 8px;letter-spacing:-1px;color:#1B2A3A}
.hero .lead{color:#4B5563;font-size:14px;margin:0}
.tag{display:inline-block;margin-top:10px;font-size:11px;font-weight:800;color:#8A5A00;background:rgba(255,236,196,.95);border-radius:999px;padding:2px 9px}
.hero-meta{position:absolute;right:14px;bottom:14px;background:rgba(255,255,255,.94);border-radius:99px;padding:4px 12px;font-size:13px;color:#374151;box-shadow:0 2px 10px rgba(30,40,60,.12)}
.hero-meta b{color:var(--p1)}

.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 4px 14px rgba(60,40,10,.05)}
.welcome{margin:16px 0 0;border:2px dashed #D9CFBF;background:#FFFDF8;box-shadow:none}
.welcome b{color:var(--p1)}

.ticket{display:flex;width:100%;padding:0;margin-top:16px;background:var(--ink);color:#fff;border-radius:16px;text-align:left;position:relative;overflow:visible}
.t-main{flex:1;padding:14px 18px}
.t-label{font-size:12px;font-weight:800;letter-spacing:1px;opacity:.7}
.t-big{font-size:21px;font-weight:900;line-height:1.3}
.t-sub{font-size:13px;opacity:.75}
.t-stub{position:relative;width:86px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;background:var(--p1);border-radius:0 16px 16px 0;border-left:2px dashed rgba(255,255,255,.55)}
.t-stub::before,.t-stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.t-stub::before{top:-8px}.t-stub::after{bottom:-8px}
.ticket.off{background:#ECE6DB;color:var(--ink)}
.ticket.off .t-stub{background:#D6CDBD;color:var(--ink);border-left-color:rgba(0,0,0,.18)}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tool{padding:12px 16px;text-align:left}
.tool .t{font-size:15px;font-weight:800}
.tool .n{font-size:13px;color:var(--sub)}
.tool .n.alert{color:var(--no);font-weight:700}

.map{margin-top:28px}
.map h2{font-size:21px;margin:0 0 2px;font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:800}
.map h2 small{font-family:inherit;font-size:13px;color:var(--sub);font-weight:700;margin-left:6px}
.map .help{font-size:13px;color:var(--sub);margin:0 0 10px}
.part{--c:var(--p1);margin-bottom:6px}
.part-label{font-size:13px;font-weight:800;color:var(--c);letter-spacing:.3px;margin:16px 0 8px}
.stations{position:relative;padding-left:40px}
.stations::before{content:"";position:absolute;left:12px;top:14px;bottom:14px;width:8px;border-radius:4px;background:var(--c)}
.station{position:relative;margin-bottom:10px}
.dot{position:absolute;left:-37px;top:13px;width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:900}
.station.done .dot{background:var(--c)}
.station.locked .dot{border-color:#CFC8BC}
.station.terminal .dot{width:34px;height:34px;left:-41px;top:6px;border-width:7px;border-color:var(--ink);box-shadow:0 0 0 3px #fff}
.st-card{padding:12px 14px}
.station.locked .st-card{background:transparent;box-shadow:none;padding:10px 4px}
.st-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st-num{font-size:12px;font-weight:800;color:var(--c)}
.station.locked .st-num{color:#A8A095}
.st-title{font-weight:800}
.station.locked .st-title{color:#9C948A;font-weight:600}
.station.terminal .st-title{color:var(--ink);font-weight:900;font-size:18px}
.st-sub{font-size:13px;color:var(--sub)}
.pass{font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:99px;padding:1px 8px}
.soon{font-size:12px;color:#A8A095}
.endlabel{font-size:12px;font-weight:800;color:#fff;background:var(--ink);border-radius:99px;padding:1px 9px}
.here{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--c);background:#fff;border:2px solid var(--c);border-radius:99px;padding:0 9px 0 5px;line-height:20px}
.lessons{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.lesson-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:14px;background:#F6F2EA}
.lesson-btn .li{width:28px;height:28px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:#fff;border:2px solid #D8D0C2;color:var(--sub)}
.lesson-btn.done .li{background:var(--c);border-color:var(--c);color:#fff}
.lesson-btn .lt{font-weight:700;font-size:15px;line-height:1.35}
.lesson-btn .lm{font-size:12px;color:var(--sub)}
.lesson-btn .chev{margin-left:auto;color:#B4AB9C;font-size:18px}
.lesson-btn.mission{background:#FFF3E0;border:2px solid #FFD199}
.lesson-btn.mission .li{border:5px solid #F3B562;background:#fff}
.lesson-btn.mission.done .li{border:2px solid var(--c);background:var(--c)}

/* ---------- 플레이어 ---------- */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0 8px}
.xbtn{width:38px;height:38px;border-radius:50%;background:#EEE8DE;font-size:18px;font-weight:700;color:#5B5348;flex:none}
.ptrack{position:relative;flex:1;height:30px}
.ptrack .rail{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:#E3DCCF}
.ptrack .fill{position:absolute;left:0;top:20px;height:6px;border-radius:3px;background:var(--p1);transition:width .35s}
.ptrack .tr{position:absolute;top:2px;transform:translateX(-50%);transition:left .35s;line-height:0}
.ptrack .goal{position:absolute;right:-3px;top:15px;width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
.pcount{font-size:13px;color:var(--sub);min-width:44px;text-align:right}
.lesson-name{font-size:13px;color:var(--sub);font-weight:700;margin:2px 0 10px}
.stage{padding-bottom:30px}
.stage.sheet-open{padding-bottom:300px}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;border-radius:99px;padding:3px 11px;margin-bottom:10px}
.k-discover{background:#E6F0FF;color:#1D4FB8}
.k-rule{background:#FFF0D6;color:#8A5A00}
.k-choose{background:#E7F6EC;color:#13693F}
.k-fix{background:#FDECEC;color:#9F1D1D}
.k-build{background:#F1EBFF;color:#5B2DBE}
.k-type{background:#E6F7F7;color:#0E6B6B}
.k-write{background:#FCE8F3;color:#9D1E63}
.k-retry{background:#1F2430;color:#fff}
.ask{font-size:19px;font-weight:800;line-height:1.4;margin:0 0 14px}
.ko{color:var(--sub);font-size:15px;margin:-4px 0 14px}

.groups{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.group{background:#fff;border-radius:16px;padding:12px 14px;border-left:6px solid #9DB8F2}
.group.g1{border-left-color:#F2B27A}
.group.g2{border-left-color:#B39CF5}
.glabel{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:4px}
.gline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:20px;padding:3px 0}
.spk{flex:none;width:38px;height:38px;border-radius:50%;background:#F1ECE3;color:#5B5348;display:inline-flex;align-items:center;justify-content:center}
.spk:active{transform:scale(.92)}

.sentence{font-size:23px;line-height:1.45;background:#fff;border-radius:16px;padding:16px;margin-bottom:16px}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--ink);text-align:center;color:transparent}
.bigword{font-size:38px;font-weight:800;text-align:center;background:#fff;border-radius:18px;padding:20px 10px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:14px}
.bigword .arrow{color:#B2A999}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:#fff;border:2px solid #E3DCCF;border-radius:16px;padding:14px 16px;font-size:17px;line-height:1.4;transition:transform .08s}
.opt.en{font-size:20px}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.right{border-color:var(--ok);background:var(--okbg);color:#0F5530;font-weight:700}
.opt.wrong{border-color:var(--no);background:var(--nobg);color:#8A1C1C;text-decoration:line-through}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.opts.row{flex-direction:row}
.opts.row .opt{text-align:center;font-weight:700}

.hintbox{background:var(--hint);border-radius:14px;padding:10px 14px;font-size:15px;margin-top:12px;display:none}
.hintbox.show{display:block;animation:pop .25s}

.toks{display:flex;flex-wrap:wrap;gap:8px;background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.tok{font-size:22px;padding:6px 10px;border-radius:10px;background:#F4EFE6;border:2px solid transparent}
.tok.miss{animation:shake .35s}
.tok.found{background:var(--nobg);border-color:var(--no);color:#8A1C1C;text-decoration:line-through}
.tok.show{background:var(--hint);border-color:#E7B53C}
.fix-ask{display:none}
.fix-ask.show{display:block;animation:pop .25s}

.zone{min-height:74px;background:#fff;border:2px dashed #D3CABB;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.zone .ph{color:#B2A999;font-size:15px;padding:0 6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;margin-bottom:16px}
.tile{font-size:21px;padding:9px 14px;border-radius:12px;background:#fff;border:2px solid #D6CDBD;box-shadow:0 2px 0 #D6CDBD}
.zone .tile{background:#F1EBFF;border-color:#C9B6F7;box-shadow:0 2px 0 #C9B6F7}
.period{font-size:22px;font-weight:800;color:#8C8375}
.zone.right{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.zone.wrong{border-style:solid;border-color:var(--no);background:var(--nobg)}

.typein{display:flex;gap:8px;margin-bottom:10px}
.typein input{flex:1;min-width:0;font-size:22px;padding:12px 14px;border-radius:14px;border:2px solid #D6CDBD;background:#fff;outline:none}
.typein input:focus{border-color:var(--p2)}
.typein input.right{border-color:var(--ok);background:var(--okbg)}
.typein input.wrong{border-color:var(--no);background:var(--nobg)}

textarea{width:100%;min-height:110px;font-size:20px;line-height:1.45;padding:14px;border-radius:16px;border:2px solid #D6CDBD;background:#fff;resize:vertical;outline:none}
textarea:focus{border-color:#D46BA3}
.wtools{display:flex;gap:8px;margin:10px 0 14px}
.wtools button{flex:1;padding:10px;border-radius:12px;background:#F1ECE3;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;color:#3F3A33}
.checks{background:#fff;border-radius:16px;padding:12px 14px}
.checks .ch-h{font-size:14px;font-weight:800;margin-bottom:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px;border-top:1px solid #F1ECE3}
.checks label:first-of-type{border-top:none}
.checks input{width:22px;height:22px;flex:none;accent-color:#D46BA3;margin-top:1px}
.samples{display:none;background:#FCE8F3;border-radius:14px;padding:10px 14px;margin-top:10px}
.samples.show{display:block;animation:pop .25s}
.samples div{font-size:18px;padding:3px 0}

.rule h2{font-size:22px;margin:0 0 6px;line-height:1.3}
.rule p{margin:6px 0}
.rbox{background:#fff;border-radius:16px;padding:12px 14px;margin:10px 0;border-top:5px solid var(--p1)}
.rbox.b{border-top-color:#5AA9E6}
.rbox.c{border-top-color:var(--p3)}
.rbox.d{border-top-color:var(--p4)}
.rbox-h{font-weight:800;margin-bottom:2px}
.ex{font-size:18px;color:#304060;background:#F6F8FC;border-radius:10px;padding:6px 10px;margin-top:6px}
.pill{display:inline-block;font-size:13px;font-weight:800;border-radius:99px;padding:1px 9px;background:#1F2430;color:#fff;margin-left:4px;vertical-align:1px}
.tip{background:var(--hint);border-radius:14px;padding:10px 14px;font-size:15px;margin-top:12px}

.primary{width:100%;padding:15px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:18px;margin-top:16px}
.primary:disabled{background:#CFC8BC}
.secondary{width:100%;padding:14px;border-radius:16px;background:#ECE6DB;font-weight:800;font-size:17px;margin-top:10px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .28s ease}
.sheet.show{transform:none}
.sheet-in{max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.12)}
.sheet-in.ok{background:var(--okbg)}
.sheet-in.no{background:var(--nobg)}
.sheet-in.info{background:#E6F0FF}
.s-title{font-size:20px;font-weight:900}
.ok .s-title{color:#0F5530}
.no .s-title{color:#8A1C1C}
.info .s-title{color:#1D4FB8}
.s-exp{font-size:16px;margin-top:6px}
.s-say{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.75);border-radius:12px;padding:8px 8px 8px 12px;font-size:19px;margin-top:10px}
.sheet .primary{margin-top:14px}

/* ---------- 결과: 역 표지판 ---------- */
.result{text-align:center;padding-top:34px}
.sign{--c:var(--p1);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(60,40,10,.12);margin:0 auto}
.sign .band{height:12px;background:var(--c)}
.sign .sbody{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px 12px 18px}
.sign .sp,.sign .sn{font-size:13px;color:var(--sub);font-weight:700}
.sign .sp{text-align:left}.sign .sn{text-align:right}
.sign .sname{display:inline-block;font-size:24px;font-weight:900;border:4px solid var(--c);border-radius:99px;padding:2px 18px;line-height:1.3}
.sign .ssub{font-size:13px;color:var(--sub);margin-top:6px}
.result h2{font-size:26px;margin:20px 0 0;font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:800}
.result .h2ko{font-size:15px;color:var(--sub);font-weight:700;margin-bottom:4px}
.result .score{color:var(--sub)}
.result .card{text-align:left;margin-top:16px}
.mini-terms{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mini-term{background:#F6F2EA;border-radius:12px;padding:8px 12px;font-size:15px}
.preview li{margin:6px 0}
.preview .en{font-weight:700}

.page-h{display:flex;align-items:center;gap:12px;padding:16px 0 6px}
.page-h h2{margin:0;font-size:22px}
.term{margin-top:12px}
.term-top{display:flex;align-items:center;gap:10px}
.term .ko-t{font-size:20px;font-weight:900}
.term .en-t{font-size:16px;color:#304060}
.term .ipa{font-size:14px;color:var(--sub);font-family:"Lucida Sans Unicode","Arial Unicode MS",sans-serif}
.term .desc{margin-top:6px;font-size:15px}
.term .tex{margin-top:6px;font-size:16px;color:#304060;background:#F6F8FC;border-radius:10px;padding:5px 10px}
.term.locked{background:#EFEAE1;box-shadow:none;color:#A8A095}
.note{font-size:14px;color:var(--sub);margin:8px 0}
.foot{text-align:center;margin-top:28px}
.danger{color:#9C948A;background:none;text-decoration:underline;font-size:13px}

.modal-bg{position:fixed;inset:0;background:rgba(20,16,10,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:20px;padding:20px;max-width:360px;width:100%}
.modal h3{margin:0 0 6px}
.modal .row{display:flex;gap:8px;margin-top:16px}
.modal .row button{flex:1;padding:12px;border-radius:12px;font-weight:800}
.modal .yes{background:var(--ink);color:#fff}
.modal .noo{background:#ECE6DB}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:15px;z-index:50;max-width:90vw;text-align:center}

@keyframes pop{from{transform:scale(.96);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- 문장 기차 ---------- */
.train{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:stretch;margin:4px 0 12px}
.car{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;padding:5px 12px 12px;border-radius:11px 11px 5px 5px;background:var(--k,#7D8794);color:#fff;font-size:19px;font-weight:800;line-height:1.2;border:none}
.car::before,.car::after{content:"";position:absolute;bottom:-5px;width:9px;height:9px;border-radius:50%;background:#2F3A4A}
.car::before{left:9px}.car::after{right:9px}
.car small{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:10.5px;font-weight:800;opacity:.92;margin-bottom:1px}
.car.S{--k:#2F6FDE}.car.V{--k:#E5484D}.car.O{--k:#7D8794}.car.X{--k:#A8906E}
.car.N{--k:#FFFFFF;color:var(--ink);border:2px solid #D6CDBD;padding:9px 14px 12px;font-size:21px}
.car.N:active{transform:scale(.96)}
.car.picked{outline:3px solid var(--ink);outline-offset:3px}
.train.sm .car{font-size:16px;padding:4px 10px 11px}
.rS{color:#2F6FDE}.rV{color:#E5484D}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.trow .train{margin:4px 0 8px}
.tapbox{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:16px;padding:14px 12px 10px;margin-bottom:12px}
.tapbox .train{margin:0}
.sentence.kq{font-size:21px;font-weight:700}
.wrongline{display:inline-block;font-size:20px;background:var(--nobg);color:#8A1C1C;text-decoration:line-through;border-radius:12px;padding:6px 12px;margin-bottom:10px}
.legend{display:flex;gap:6px;margin:-4px 0 10px}
.lg{font-size:12px;font-weight:800;color:#fff;border-radius:99px;padding:1px 9px}
.lg.S{background:#2F6FDE}.lg.V{background:#E5484D}.lg.O{background:#7D8794}
.tile.S,.zone .tile.S{background:#2F6FDE;color:#fff;border-color:#2F6FDE;box-shadow:0 2px 0 #1D4FB8}
.tile.V,.zone .tile.V{background:#E5484D;color:#fff;border-color:#E5484D;box-shadow:0 2px 0 #B83236}
.tile.O,.zone .tile.O{background:#7D8794;color:#fff;border-color:#7D8794;box-shadow:0 2px 0 #5F6873}

<body>
<div id="app"></div>
<div class="sheet" id="sheet"></div>

<script>
/* =========================================================
   0. 문장 기차(색깔 칸) 도우미
   ========================================================= */
const ROLE={S:"누가",V:"한다",O:"무엇을",X:"언제·어디서"};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
/* cars: [["I","S"],["like","V"],["pizza","O"]] */
function trainHTML(cars,o={}){
  return `<div class="train ${o.en?"en":""} ${o.sm?"sm":""}">${cars.map(([t,r],i)=>
    `<span class="car ${r}${o.picked===i?" picked":""}">${o.nolabel?"":`<small>${ROLE[r]}</small>`}${esc(t)}</span>`).join("")}</div>`;
}
const sentenceOf=cars=>cars.map(c=>c[0]).join(" ");

/* =========================================================
   1. 교육과정 기반 콘텐츠
   ========================================================= */
const PARTS = {
  1:{name:"MAIN LINE · 필수 역", c:"--p1"},
  2:{name:"BRANCH LINE · 선택 역 · 필요할 때 들러요", c:"--p3"},
  5:{name:"FINAL", c:"--p5"},
  6:{name:"부록 · 중학교 미리보기", c:"--p6"}
};
const UNITS = [
  {id:1, part:1, title:"문장의 뼈대", sub:"I like pizza."},
  {id:2, part:1, title:"be동사 vs 일반동사", sub:"I am happy. / I like apples."},

  {id:6, part:1, title:"과거", sub:"was, were, played, went"},

  {id:8, part:1, title:"의문사 의문문", sub:"What do you ~? Where did you ~?"},
  {id:9, part:2, title:"명사와 관사", sub:"a book, two books, an apple"},

  {id:17, part:6, title:"Middle School 중학교 입구", sub:"최상급, to부정사, should, when"}
];
const CORE=8;
const unitLabel=u=>u.id<=CORE?`Stop ${u.id}`:(u.part===2?`Branch ${u.id-CORE}`:"");

const TERMS = {
  wordorder:{ko:"어순", en:"word order", ipa:"/ˈwɜːrd ˌɔːrdər/", desc:"단어가 놓이는 순서예요. 영어는 '누가 → 한다 → 무엇을' 순서로 말해요.", ex:"I like pizza. (O) / I pizza like. (X)"},
  subject:{ko:"주어", en:"subject", ipa:"/ˈsʌbdʒɪkt/", desc:"문장의 주인공, '누가'에 해당하는 말이에요. 문장 기차의 파란 칸!", ex:"I, We, My friends"},
  verb:{ko:"동사", en:"verb", ipa:"/vɜːrb/", desc:"'한다'에 해당하는 말이에요. 영어에서는 주어 바로 뒤에 와요. 문장 기차의 빨간 칸!", ex:"like, play, eat, read"},
  noun:{ko:"명사", en:"noun", ipa:"/naʊn/", desc:"사람, 물건, 장소 등의 이름이에요.", ex:"friend, bag, school"},

  uncountable:{ko:"셀 수 없는 명사", en:"uncountable noun", ipa:"/ʌnˈkaʊntəbl naʊn/", desc:"하나, 둘 셀 수 없는 명사예요. a와 -s를 붙이지 않아요.", ex:"water, milk, bread, money"},
  singular:{ko:"단수", en:"singular", ipa:"/ˈsɪŋɡjələr/", desc:"하나를 나타내는 형태예요.", ex:"a book, a child"},
  plural:{ko:"복수", en:"plural", ipa:"/ˈplʊrəl/", desc:"둘 이상을 나타내는 형태예요.", ex:"books, boxes, children"},
  article:{ko:"관사", en:"article", ipa:"/ˈɑːrtɪkl/", desc:"명사 앞에 붙는 a, an, the를 말해요.", ex:"a bag, an egg, the moon"},
  indef:{ko:"부정관사", en:"indefinite article", ipa:"/ɪnˈdefɪnət ˈɑːrtɪkl/", desc:"a, an이에요. 여기서 '부정(不定)'은 '정해지지 않았다'는 뜻이에요. '아니다'라는 뜻이 아니에요!", ex:"a dog (아무 개 한 마리)"},
  def:{ko:"정관사", en:"definite article", ipa:"/ˈdefɪnət ˈɑːrtɪkl/", desc:"the예요. 정해진 '그것'을 가리킬 때 써요.", ex:"the dog (앞에서 말한 그 개)"}
};

/* ---------- 필수 역 1: 문장의 뼈대 ---------- */
const S1R1 = `
<h2>영어 문장의 뼈대</h2>
<p>영어 문장은 <b>누가 → 한다 → 무엇을</b> 순서로 달려요.</p>
${trainHTML([["I","S"],["like","V"],["pizza","O"]],{en:true})}
<div class="rbox"><div class="rbox-h">한국어와 비교해요</div>
${trainHTML([["나는","S"],["피자를","O"],["좋아해","V"]],{sm:true})}

<div class="tip"><b>알고 있었나요?</b> 초등학교 때 말하던 <span class="en">I like ~, I have ~, I play ~</span>도 모두 이 순서였어요.</div>`;

<div class="rbox" style="border-top-color:#E5484D"><div class="rbox-h"><span class="rV">동사</span> = 한다 (빨간 칸)</div>

<div class="rbox" style="border-top-color:#A8906E"><div class="rbox-h">언제·어디서는 맨 뒤 칸</div>
<p>문장이 길어져도 뼈대는 그대로예요.</p>${trainHTML([["We","S"],["play","V"],["soccer","O"],["after school","X"]],{en:true,sm:true})}</div>
<div class="tip"><b>중학교에서는</b> 선생님이 '주어', '동사'라는 말을 자주 써요. 들으면 파란 칸, 빨간 칸을 떠올리세요!</div>`;

   ]},
  {slot:1, key:"1-2", title:"주어와 동사 찾기", en:"My friends play soccer.", mins:5, terms:["subject","verb"],

const KEY = "middleSchoolRoad_v2";
let mem = null;
function blank(){return {done:[], stats:{}, last:{}};}
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const s=JSON.parse(r); if(s&&Array.isArray(s.done)) return Object.assign(blank(),s);}}
  catch(e){}
  return mem||blank();
}
let S = load();
function save(){mem=S; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const slotIdx=(u,s)=>(u-1)*4+s;
const isDone=(u,s)=>S.done.includes(slotIdx(u,s));
function setDone(u,s){const i=slotIdx(u,s); if(!S.done.includes(i)){S.done.push(i); save();}}
const missionOf=u=>(LESSONS[u]||[]).find(l=>l.mission);
const unitPassed=u=>{const m=missionOf(u); return !!m&&isDone(u,m.slot);};

function today(){const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);}
const GAP=[0,1,2,4,7,15];
/* 기록은 문제가 아니라 '규칙 묶음' 단위 */
function record(st,ok){
  const g=groupOf(st);
  const s=S.stats[g]||{lv:0,due:0,box:false,ok2:0};
  if(ok){
    /* 같은 날 여러 번 맞혀도 복습 간격은 하루에 한 단계만 늘어나요 */
    if(s.d!==today()){s.lv=Math.min(s.lv+1,5); s.due=today()+GAP[s.lv]; s.d=today();}
    if(s.box){s.ok2++; if(s.ok2>=2){s.box=false; s.ok2=0;}}
  }else{s.lv=0; s.due=today(); s.d=today(); s.box=true; s.ok2=0;}
  S.stats[g]=s; S.last[g]=st.id; save();
}
const known=g=>GROUPS[g]&&GROUPS[g].length;
const boxGroups=()=>Object.keys(S.stats).filter(g=>S.stats[g].box&&known(g));
function dueGroups(){
  const t=today();
  return Object.keys(S.stats).filter(g=>known(g)&&S.stats[g].due<=t)
    .sort((a,b)=>(S.stats[b].box-S.stats[a].box)||(S.stats[a].due-S.stats[b].due));
}
/* 같은 묶음에서 지난번과 다른 문제 고르기 */
function pickFrom(g){
  const ids=GROUPS[g]; let c=ids.filter(id=>id!==S.last[g]); if(!c.length) c=ids;
  return c[Math.floor(Math.random()*c.length)];
}
function earnedTerms(){
  const set=new Set();
  Object.entries(LESSONS).forEach(([u,ls])=>ls.forEach(l=>{
    if(isDone(+u,l.slot)||unitPassed(+u)) l.terms.forEach(t=>set.add(t));
  }));
  return set;
}

function placeHero(passed){
  const p=document.getElementById("trk"); if(!p||!p.getTotalLength) return;
  let L; try{L=p.getTotalLength();}catch(e){return;}
  const at=f=>p.getPointAtLength(Math.max(0,Math.min(1,f))*L);
  const frac=i=>0.30+(i-1)/(CORE-1)*0.60;
  const c=getComputedStyle(document.documentElement).getPropertyValue("--p1").trim();
  let dots="";
  for(let i=1;i<=CORE;i++){
    const pt=at(frac(i)), done=unitPassed(i);
    dots+=`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="4.6" fill="${done?c:"#fff"}" stroke="${c}" stroke-width="2.6"/>`;
  }
  const end=at(1); dots+=`<circle cx="${end.x.toFixed(1)}" cy="${end.y.toFixed(1)}" r="5.5" fill="#fff" stroke="#1B2A3A" stroke-width="3.2"/>`;
  document.getElementById("heroDots").innerHTML=dots;
  const f=passed===0?0.215:(passed>=CORE?0.95:frac(passed)+0.04);
  const a=at(f), b=at(f+0.01), ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  document.getElementById("heroTrain").innerHTML=`<g transform="translate(${a.x.toFixed(1)} ${(a.y-1).toFixed(1)}) rotate(${ang.toFixed(1)})">${trainShape("#1F9D6B")}</g>`;
}

      : `<button class="ticket off" id="goPractice"><div class="t-main"><div class="t-label en">TODAY'S REVIEW</div><div class="t-big">오늘 복습 끝</div><div class="t-sub">더 하고 싶으면 연습 5문제</div></div><div class="t-stub en">Practice</div></button>`;
  }
  h+=`<div class="tools">
    <button class="card tool" id="goBox"><div class="t">오답 상자</div><div class="n ${box?"alert":""}">${box?box+"문제 남았어요":"비어 있어요"}</div></button>
    <button class="card tool" id="goTerms"><div class="t">용어 사전</div><div class="n">${terms} / ${termTotal}장 모음</div></button>
  </div>`;
  h+=`<section class="map"><h2>Route Map<small>노선도</small></h2><p class="help">필수 역을 차례로 지나 종착역 중학교까지 가요.</p>`;
  let cur=0;
  UNITS.forEach(u=>{
    if(u.part!==cur){ if(cur) h+=`</div></div>`; cur=u.part; h+=`<div class="part" style="--c:var(${PARTS[u.part].c})"><div class="part-label">${PARTS[u.part].name}</div><div class="stations">`; }
    const ls=LESSONS[u.id], terminal=u.id===17, lab=unitLabel(u);
    if(!ls){
      h+=`<div class="station locked ${terminal?"terminal":""}"><div class="dot"></div><div class="card st-card"><div class="st-head">
        ${lab?`<span class="st-num en">${lab}</span>`:""}<span class="st-title">${esc(u.title)}</span>
        ${terminal?`<span class="endlabel en">Last stop</span>`:""}<span class="soon en">Coming soon</span></div></div></div>`;
      return;
    }
    const pass=unitPassed(u.id), here=hereUnit&&hereUnit.id===u.id;
    h+=`<div class="station ${pass?"done":""}"><div class="dot">${pass?"✓":""}</div><div class="card st-card">
      <div class="st-head"><span class="st-num en">${lab}</span><span class="st-title">${esc(u.title)}</span>
      ${pass?`<span class="pass en">Passed</span>`:""}${here?`<span class="here en">${miniTrain("var(--c)",28)}You are here</span>`:""}</div>
      <div class="st-sub en">${esc(u.sub)}</div><div class="lessons">`;
    ls.forEach(l=>{
      const d=isDone(u.id,l.slot);
      h+=`<button class="lesson-btn ${d?"done":""} ${l.mission?"mission":""}" data-u="${u.id}" data-s="${l.slot}">
        <span class="li">${d?"✓":(l.mission?"":l.key.split("-").pop())}</span>
        <span><div class="lt">${l.mission?"":l.key+" "}${esc(l.title)}</div><div class="lm">${l.mission?esc(l.en):`<span class="en">${esc(l.en)}</span> · 약 ${l.mins}분`}</div></span>
        <span class="chev">›</span></button>`;
    });
    h+=`</div></div></div>`;
  });
  h+=`</div></div></section><div class="foot"><button class="danger" id="reset">이 기기의 학습 기록 지우기</button></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  placeHero(passed);
  app.querySelectorAll(".lesson-btn").forEach(b=>b.onclick=()=>startLesson(+b.dataset.u,+b.dataset.s));
  const r=$("#goReview"); if(r) r.onclick=startReview;
  const p=$("#goPractice"); if(p) p.onclick=startPractice;
  $("#goBox").onclick=startBox; $("#goTerms").onclick=renderTerms;
  $("#reset").onclick=resetAll;
}

/* =========================================================
   5. 학습 진행
   ========================================================= */
let SES=null;
function startLesson(u,slot){
  const l=LESSONS[u].find(x=>x.slot===slot), unit=UNITS[u-1];
  SES={mode:l.mission?"mission":"lesson", u, lesson:l, title:`${unitLabel(unit)} · ${l.mission?"통과 미션":l.key+" "+l.title}`,
       steps:l.steps.map(s=>Object.assign({},s)), i:0, ok:0, total:0, wrongFrom:new Set()};
  renderStep();
}
function groupSession(mode,title,groups){
  SES={mode,title,steps:groups.map(g=>Object.assign({},ITEMS[pickFrom(g)])),i:0,ok:0,total:0,wrongFrom:new Set()};
  renderStep();
}
function startReview(){
  const gs=dueGroups().slice(0,5);
  if(!gs.length){toast("오늘 복습할 문제가 없어요"); return;}
  groupSession("review","오늘의 복습",shuffle(gs));
}
function startPractice(){
  const gs=shuffle(Object.keys(S.stats).filter(known)).slice(0,5);
  if(!gs.length){toast("레슨을 하나 끝내면 연습 문제가 생겨요"); return;}
  groupSession("practice","연습 5문제",gs);
}
function startBox(){
  const gs=boxGroups();
  if(!gs.length){toast("오답 상자가 비어 있어요"); return;}
  groupSession("box","오답 상자",shuffle(gs).slice(0,10));
}

const KIND={discover:["k-discover","발견하기"],rule:["k-rule","규칙 정리"],mc:["k-choose","고르기"],tap:["k-choose","칸 찾기"],
  fix:["k-fix","고치기"],build:["k-build","문장 만들기"],type:["k-type","써 보기"],write:["k-write","나만의 문장"]};

function renderStep(){
  closeSheet();
  const st=SES.steps[SES.i], n=SES.steps.length, pct=SES.i/n*100;
  app.innerHTML=`<div class="topbar"><button class="xbtn" id="xbtn" aria-label="나가기">✕</button>
    <div class="ptrack"><div class="rail"></div><div class="fill" style="width:${pct}%"></div><div class="goal"></div>
      <div class="tr" style="left:clamp(19px, ${pct}%, calc(100% - 19px))">${miniTrain("#1F9D6B",38)}</div></div>
    <div class="pcount">${SES.i+1} / ${n}</div></div>
    <div class="lesson-name">${esc(SES.title)}</div>
    <div class="stage" id="stage"></div>`;
  $("#xbtn").onclick=()=>modal("그만할까요?","지금 레슨의 진행은 저장되지 않아요. 푼 문제의 복습 기록은 남아요.","나가기","계속하기",renderHome);
  const stage=$("#stage");
  const k=(st.t==="build"&&st.wrongShow)?["k-fix","고치기"]:KIND[st.t];
  let head=st.retry?`<span class="kind k-retry">한 번 더</span> `:"";
  head+=`<span class="kind ${k[0]}">${k[1]}</span>`;
  stage.innerHTML=head+`<div id="body"></div>`;
  ({discover:rDiscover,rule:rRule,mc:rMC,tap:rTap,fix:rFix,build:rBuild,type:rType,write:rWrite})[st.t](st,$("#body"));
  window.scrollTo(0,0);
}

function answerOf(st){
  if(st.say) return st.say;
  if(st.t==="build") return (st.cars?sentenceOf(st.cars):st.ans[0])+".";
  if(st.t==="tap") return sentenceOf(st.cars)+".";
  if(st.t==="type") return st.word+" → "+st.ans[0];
  if(st.t==="fix") return st.opts[st.a];
  return null;
}
function graded(st,ok){
  record(st,ok);
  if(!st.retry){SES.total++; if(ok) SES.ok++;}
  if(!ok){
    if(st.from) SES.wrongFrom.add(st.from);
    if(SES.mode==="lesson"&&!st.retry) SES.steps.push(Object.assign({},st,{retry:true}));
  }
  showSheet({kind:ok?"ok":"no", title:ok?pick(PRAISE):"거의 다 왔어요! 정답을 확인해요",
    exp:st.exp+((!ok&&SES.mode==="lesson"&&!st.retry)?"<br><span style='font-size:14px'>오답 상자에 넣었어요. 레슨 끝에 한 번 더 나와요.</span>":""),
    say:answerOf(st), train:(st.t==="build"&&st.cars)?st.cars:null});
}

function showSheet({kind,title,exp,say,btn,train}){
  sheet.innerHTML=`<div class="sheet-in ${kind}"><div class="s-title">${title}</div>
    ${exp?`<div class="s-exp">${exp}</div>`:""}
    ${train?`<div class="s-train">${trainHTML(train,{en:true,sm:true})}</div>`:""}
    ${say?`<div class="s-say en"><span>${esc(say)}</span>${spk(say)}</div>`:""}
    <button class="primary" id="nextBtn">${btn||"다음 →"}</button></div>`;
  sheet.classList.add("show"); const sg=$("#stage"); if(sg) sg.classList.add("sheet-open");
  $("#nextBtn").onclick=next;
  setTimeout(()=>{const b=$("#nextBtn"); if(b) b.focus({preventScroll:true});},50);
}
function closeSheet(){sheet.classList.remove("show"); sheet.innerHTML="";}
function next(){SES.i++; if(SES.i>=SES.steps.length) finish(); else renderStep();}

function groupsHTML(gs){
  return `<div class="groups">`+gs.map((g,gi)=>`<div class="group g${gi}">${g.label?`<div class="glabel">${esc(g.label)}</div>`:""}
    ${g.lines.map(l=>`<div class="gline en"><span>${esc(l)}</span>${spk(l)}</div>`).join("")}</div>`).join("")+`</div>`;
}
function trainsHTML(ts){
  return `<div class="groups">`+ts.map(t=>`<div class="group tg">${t.label?`<div class="glabel">${esc(t.label)}</div>`:""}
    <div class="trow">${trainHTML(t.cars,{en:t.en})}${t.en?spk(sentenceOf(t.cars)):""}</div></div>`).join("")+`</div>`;
}
function rDiscover(st,el){
  const opts=shuffle(st.opts.map((t,i)=>({t,ok:i===st.a})));
  el.innerHTML=(st.trains?trainsHTML(st.trains):groupsHTML(st.groups))+`<div class="ask">${esc(st.ask)}</div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>
    <div class="hintbox" id="hint"><b>힌트</b> ${esc(st.hint||"다시 한번 비교해 봐요.")}</div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    if(o.ok){
      b.classList.add("right"); el.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      showSheet({kind:"info",title:"발견했어요!",exp:st.exp});
    }else{ b.classList.add("wrong"); b.disabled=true; $("#hint").classList.add("show"); }
  });
}
function rRule(st,el){
  el.innerHTML=`<div class="rule">${st.html}</div><button class="primary" id="ruleOk">알겠어요! 문제 풀러 가기 →</button>`;
  el.querySelectorAll(".ex").forEach(x=>{x.style.cursor="pointer"; x.title="눌러서 듣기"; x.onclick=()=>speak(x.textContent);});
  el.querySelectorAll(".train.en").forEach(x=>{x.style.cursor="pointer"; x.onclick=()=>speak(x.textContent.replace(/누가|한다|무엇을|언제·어디서/g," "));});
  $("#ruleOk").onclick=next;
}
function blankQ(q){return esc(q).split("___").join(`<span class="blank">___</span>`);}
function rMC(st,el){
  const opts=shuffle(st.opts.map((t,i)=>({t,ok:i===st.a})));
  const enOpt=!st.word;
  let h=`<div class="ask">${esc(st.ask||"빈칸에 알맞은 것을 골라요.")}</div>`;
  if(st.kq) h+=`<div class="sentence kq">${esc(st.kq)}</div>`;
  if(st.word) h+=`<div class="bigword en">${esc(st.word)}${spk(st.word)}</div>`;
  if(st.q) h+=`<div class="sentence en">${blankQ(st.q)}</div>`;
  if(st.ko) h+=`<div class="ko">${esc(st.ko)}</div>`;
  h+=`<div class="opts ${st.row?"row":""}">${opts.map((o,i)=>`<button class="opt ${enOpt?"en":""}" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>`;
  el.innerHTML=h;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    el.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    b.classList.add(o.ok?"right":"wrong");
    if(!o.ok) el.querySelector(`.opt[data-i="${opts.findIndex(x=>x.ok)}"]`).classList.add("right");
    graded(st,o.ok);
  });
}
/* 칸 찾기: 색이 없는 기차에서 주어나 동사 칸을 눌러요 */
function rTap(st,el){
  const idx=st.cars.findIndex(c=>c[1]===st.find);
  const askTxt=st.find==="S"
    ?`<span class="rS">누가(주어)</span>에 해당하는 칸을 눌러 보세요.`
    :`<span class="rV">한다(동사)</span>에 해당하는 칸을 눌러 보세요.`;
  el.innerHTML=`<div class="ask">${askTxt}</div>
    <div class="tapbox"><div class="train en" id="tt">${st.cars.map((c,i)=>`<button class="car N" data-i="${i}">${esc(c[0])}</button>`).join("")}</div>
    ${spk(sentenceOf(st.cars)+".")}</div>
    ${st.ko?`<div class="ko">${esc(st.ko)}</div>`:""}`;
  el.querySelectorAll("#tt .car").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===idx;
    $("#tt").outerHTML=trainHTML(st.cars,{en:true,picked:i});
    graded(st,ok);
  });
}
function rFix(st,el){
  let miss=false, tries=0;
  const opts=shuffle(st.opts.map((t,i)=>({t,ok:i===st.a})));
  el.innerHTML=`<div class="ask">틀린 부분을 찾아서 눌러 보세요.</div>
    <div class="toks en">${st.tokens.map((t,i)=>`<button class="tok" data-i="${i}">${esc(t)}</button>`).join("")}</div>
    <div class="hintbox" id="hint"></div>
    <div class="fix-ask" id="fixAsk"><div class="ask">어떻게 고칠까요?</div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt en" data-i="${i}">${esc(o.t)}</button>`).join("")}</div></div>`;
  const toks=el.querySelectorAll(".tok");
  function found(){
    toks.forEach(t=>{t.disabled=true; if(st.wrong.includes(+t.dataset.i)) t.classList.add("found");});
    $("#fixAsk").classList.add("show");
    setTimeout(()=>$("#fixAsk").scrollIntoView({behavior:"smooth",block:"center"}),80);
  }
  toks.forEach(t=>t.onclick=()=>{
    const i=+t.dataset.i;
    if(st.wrong.includes(i)){found(); return;}
    miss=true; tries++;
    t.classList.remove("miss"); void t.offsetWidth; t.classList.add("miss");
    const hb=$("#hint");
    if(tries>=2){
      toks.forEach(x=>{if(st.wrong.includes(+x.dataset.i)) x.classList.add("show");});
      hb.innerHTML="<b>힌트</b> 노랗게 표시된 곳이 틀렸어요. 눌러 보세요."; hb.classList.add("show");
    }else{hb.innerHTML="<b>힌트</b> 그 부분은 맞아요. 명사와 그 앞뒤를 살펴보세요."; hb.classList.add("show");}
  });
  el.querySelectorAll("#fixAsk .opt").forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    el.querySelectorAll("#fixAsk .opt").forEach(x=>x.disabled=true);
    b.classList.add(o.ok?"right":"wrong");
    if(!o.ok) el.querySelector(`#fixAsk .opt[data-i="${opts.findIndex(x=>x.ok)}"]`).classList.add("right");
    graded(st,o.ok&&!miss);
  });
}
/* 문장 만들기: cars가 있으면 기차 칸, colored면 색깔 힌트 */
function rBuild(st,el){
  const tiles=st.cars?st.cars.map(c=>({t:c[0],r:c[1]})):st.tiles.map(t=>({t,r:""}));
  const answer=st.cars?sentenceOf(st.cars):st.ans[0];
  const answers=st.cars?[answer]:st.ans;
  let pool=tiles.map((x,i)=>Object.assign({i},x));
  for(let k=0;k<8;k++){pool=shuffle(pool); if(pool.map(x=>x.t).join(" ")!==answer) break;}
  let placed=[];
  const cls=p=>st.colored&&p.r?p.r:"";
  function draw(){
    el.innerHTML=`<div class="ask">${st.wrongShow?"기차 칸 순서를 바르게 고쳐요.":"단어를 순서대로 눌러 문장을 만들어요."}</div>
      ${st.wrongShow?`<div class="wrongline en">${esc(st.wrongShow)}</div>`:""}
      <div class="ko">${esc(st.ko)}</div>
      ${st.colored?`<div class="legend"><span class="lg S">누가</span><span class="lg V">한다</span><span class="lg O">무엇을</span></div>`:""}
      <div class="zone en" id="zone">${placed.length?placed.map((p,k)=>`<button class="tile ${cls(p)}" data-k="${k}">${esc(p.t)}</button>`).join("")+`<span class="period">.</span>`:`<span class="ph">여기에 단어가 들어가요</span>`}</div>
      <div class="pool en">${pool.map((p,k)=>`<button class="tile ${cls(p)}" data-p="${k}">${esc(p.t)}</button>`).join("")}</div>
      <button class="primary" id="chk" ${pool.length?"disabled":""}>확인하기</button>`;
    el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{placed.push(pool.splice(+b.dataset.p,1)[0]); draw();});
    el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pool.push(placed.splice(+b.dataset.k,1)[0]); draw();});
    $("#chk").onclick=()=>{
      const ok=answers.map(norm).includes(norm(placed.map(p=>p.t).join(" ")));
      $("#zone").classList.add(ok?"right":"wrong");
      el.querySelectorAll(".tile").forEach(x=>x.disabled=true); $("#chk").disabled=true;
      graded(st,ok);
    };
  }
  draw();
}
function rType(st,el){
  el.innerHTML=`<div class="ask">${esc(st.ask)}</div>
    <div class="bigword en">${esc(st.word)} <span class="arrow">→ ?</span>${spk(st.word)}</div>
    <div class="typein"><input id="tin" class="en" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="여기에 쓰기" enterkeyhint="done"></div>
    <button class="primary" id="chk" disabled>확인하기</button>`;
  const inp=$("#tin"), chk=$("#chk");
  inp.oninput=()=>chk.disabled=!inp.value.trim();
  const go=()=>{
    if(!inp.value.trim()||chk.dataset.done) return;
    chk.dataset.done=1; chk.disabled=true; inp.readOnly=true; inp.blur();
    const ok=st.ans.map(norm).includes(norm(inp.value));
    inp.classList.add(ok?"right":"wrong");
    graded(st,ok);
  };
  chk.onclick=go; inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault(); go();}};
}
function rWrite(st,el){
  el.innerHTML=`<div class="ask">${esc(st.ask)}</div>
    <textarea id="wt" class="en" autocapitalize="sentences" spellcheck="false">${esc(st.starter)}</textarea>
    <div class="wtools"><button id="wsay">${SPK_SVG}내 문장 듣기</button><button id="wsam">예시 보기</button></div>
    <div class="samples" id="sam">${st.samples.map(s=>`<div class="en">${esc(s)}</div>`).join("")}</div>
    <div class="checks"><div class="ch-h">스스로 점검해요</div>${st.checks.map(c=>`<label><input type="checkbox">${esc(c)}</label>`).join("")}</div>
    <button class="primary" id="wdone" disabled>다 썼어요!</button>`;
  const ta=$("#wt"), done=$("#wdone"), boxes=el.querySelectorAll(".checks input");
  const upd=()=>{done.disabled=ta.value.trim().length<st.starter.trim().length+3||[...boxes].some(b=>!b.checked);};
  ta.oninput=upd; boxes.forEach(b=>b.onchange=upd);
  $("#wsay").onclick=()=>{const v=ta.value.trim(); if(v.length>st.starter.trim().length) speak(v); else toast("먼저 문장을 완성해 봐요");};
  $("#wsam").onclick=()=>$("#sam").classList.toggle("show");
  done.onclick=()=>showSheet({kind:"info",title:"멋진 문장이에요!",exp:"점검표를 모두 확인했어요. 내 문장을 소리 내어 한 번 읽어 보세요.",say:ta.value.trim()});
  setTimeout(()=>{ta.focus({preventScroll:true}); const L=ta.value.length; try{ta.setSelectionRange(L,L);}catch(e){}},100);
}

function finish(){
  closeSheet();
  const m=SES.mode, sc=`${SES.total}문제 중 ${SES.ok}개 정답`;
  let h=`<div class="result">`;
  if(m==="lesson"){
    const u=UNITS[SES.u-1], before=earnedTerms(); setDone(SES.u,SES.lesson.slot);
    const newT=SES.lesson.terms.filter(t=>!before.has(t));
    const ls=LESSONS[SES.u], pos=ls.indexOf(SES.lesson), nx=ls[pos+1], pv=ls[pos-1];
    h+=stationSign({c:PARTS[u.part].c, cur:SES.lesson.key, sub:SES.lesson.title, prev:pv?pv.key:"Start", next:nx?(nx.mission?"Mission":nx.key):""});
    h+=`<h2>Arrived at ${SES.lesson.key}!</h2><div class="h2ko">${SES.lesson.key}역 도착</div><div class="score">처음 풀었을 때 ${sc}</div>`;
    if(newT.length) h+=`<div class="card"><b>새 용어 카드를 모았어요</b>${termsHTML(newT)}<div class="note">중학교 수업에서 이 용어로 설명해요. 용어 사전에서 다시 볼 수 있어요.</div></div>`;
    h+=`<div class="card"><b>내일 다시 만나요</b><div class="note" style="margin:4px 0 0">오늘 배운 규칙이 며칠 간격으로 '오늘의 복습'에 다시 나와요. 그때는 다른 문장으로 나오니까 규칙을 떠올려 풀어 보세요.</div></div>`;
    if(nx) h+=`<button class="primary" id="nx">${nx.mission?"통과 미션 도전하기":"Next stop: "+nx.key+" "+esc(nx.title)} →</button>`;
    h+=`<button class="secondary" id="home">노선도로 돌아가기</button>`;
  }else if(m==="mission"){
    const pass=SES.lesson.pass||6, ok=SES.ok>=pass, u=UNITS[SES.u-1];
    const ls=LESSONS[SES.u], lastL=ls.filter(l=>!l.mission).slice(-1)[0];
    const nu=UNITS.find(x=>x.part===u.part&&x.id>u.id);
    h+=stationSign({c:PARTS[u.part].c, cur:unitLabel(u), sub:u.title, prev:lastL?lastL.key:"", next:ok&&nu?unitLabel(nu):""});
    if(ok){
      setDone(SES.u,SES.lesson.slot);
      const pv=PREVIEWS[SES.u]||[];
      h+=`<h2>${unitLabel(u)} Clear!</h2><div class="h2ko">${esc(u.title)} 역 통과</div><div class="score">${sc}</div>
        ${pv.length?`<div class="card"><b>중학교에서는 이렇게 이어져요</b><ul class="preview">${pv.map(p=>`<li><span class="en">${esc(p[0])}</span><br><span style="font-size:14px;color:var(--sub)">${esc(p[1])}</span></li>`).join("")}</ul>
        <div class="note">지금 다 알 필요는 없어요. '이런 게 나오는구나' 정도면 충분해요.</div></div>`:""}`;
    }else{
      const which=[...SES.wrongFrom].sort();
      h+=`<h2>Almost there!</h2><div class="h2ko">조금만 더</div><div class="score">${sc} · ${pass}개 이상이면 통과예요</div>
        <div class="card"><b>이 레슨을 다시 보면 좋아요</b><div class="note">${which.length?which.map(k=>{const l=ls.find(x=>x.key===k); return l?`${k} ${esc(l.title)}`:k;}).join("<br>"):"틀린 문제를 오답 상자에서 다시 풀어 봐요."}</div></div>
        <button class="primary" id="again">다시 도전하기</button>`;
    }
    h+=`<button class="secondary" id="home">노선도로 돌아가기</button>`;
  }else{
    const name={review:"오늘의 복습",practice:"연습",box:"오답 상자"}[m];
    const left=boxGroups().length;
    h+=stationSign({c:"--p6", cur:name, sub:"완료"});
    h+=`<h2>Well done!</h2><div class="h2ko">${name} 끝</div><div class="score">${sc}</div>
      <div class="card"><div class="note" style="margin:0">${left?`오답 상자에 <b>${left}문제</b>가 남았어요. 같은 규칙을 연속 두 번 맞히면 상자에서 빠져요.`:"오답 상자가 비었어요. 정말 잘했어요!"}</div></div>
      <button class="primary" id="home">노선도로 돌아가기</button>`;
  }
  h+=`</div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  $("#home").onclick=renderHome;
  const nb=$("#nx"); if(nb){const ls=LESSONS[SES.u], nx=ls[ls.indexOf(SES.lesson)+1]; nb.onclick=()=>startLesson(SES.u,nx.slot);}
  const ag=$("#again"); if(ag){const u=SES.u, sl=SES.lesson.slot; ag.onclick=()=>startLesson(u,sl);}
}

/* =========================================================
   6. 용어 사전, 기록 지우기
   ========================================================= */
function renderTerms(){
  const got=earnedTerms();
  let h=`<div class="page-h"><button class="xbtn" id="back" aria-label="뒤로">‹</button><h2>중학교 문법 용어 사전</h2></div>
    <p class="note">레슨을 마치면 카드가 열려요. 중학교 선생님이 이 용어로 설명하니까 미리 익혀 두세요.</p>`;
  Object.entries(TERMS).forEach(([k,t])=>{
    h+= got.has(k)
      ? `<div class="card term"><div class="term-top"><span class="ko-t">${t.ko}</span>${spk(t.en)}</div>
         <div><span class="en en-t">${t.en}</span> <span class="ipa">${t.ipa}</span></div>
         <div class="desc">${esc(t.desc)}</div><div class="tex en">${esc(t.ex)}</div></div>`
      : `<div class="card term locked"><span class="ko-t">???</span><div class="desc">레슨을 마치면 열려요.</div></div>`;
  });
  h+=`<p class="note" style="margin-top:16px">다른 역의 용어 카드는 역이 추가되면 함께 생겨요.</p>`;
  app.innerHTML=h; window.scrollTo(0,0); $("#back").onclick=renderHome;
}
function resetAll(){
  modal("정말 지울까요?","완료한 레슨, 오답 상자, 복습 기록이 모두 사라져요.","모두 지우기","취소",()=>{
    S=blank(); mem=null; try{localStorage.removeItem(KEY);}catch(e){} toast("기록을 지웠어요"); renderHome();});
}

renderHome();
</script>
